apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: workload-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - name: http
              containerPort: 80
          
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
          
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          
          env:
            - name: DEMO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: frontend-demo
                  key: DEMO_API_KEY
      volumes:
      - name: content
        configMap:
          name: frontend-content